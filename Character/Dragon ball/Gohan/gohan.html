<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gohan - Quotes</title>
  <link rel="stylesheet" href="gohan.css">
  <link rel="stylesheet" href="/css/button.css">
</head>
<body style="background-image: url('https://images.alphacoders.com/126/1266726.png'); background-size: cover; background-attachment: fixed; color: white;">
  

  <!-- Content Section -->
  <div class="content">
    <h1>Gohan - Famous Quotes</h1>
    <div class="quotes">
      <div class="quote bot" onclick="copyQuote(this)">
        <p>“You’re going to pay for what you did to my friends!”</p>
      </div>
      <div class="quote bot" onclick="copyQuote(this)">
        <p>“I’m not a fighter like my dad… but I’ll fight to protect the people I love.”</p>
      </div>
      <div class="quote bot" onclick="copyQuote(this)">
        <p>"I’m my father’s son!"</p>
      </div>
      <div class="quote bot" onclick="copyQuote(this)">
        <p>“I won’t let you destroy my world!”</p>
      </div>
    </div>
  </div>
  <div class="button-container">
    <button class="image-button">
        <a href="/Character/Dragon ball/DB.html"><img src="/img/hd-png-dragon-ball-z-dbz-crystal-ball-4-stars-701751694862279ebqx9sdnpz-removebg-preview.png" alt="Example" ></a>
       </button>
  </div>
  <div class="button-container">
    <button class="image-button">
        <a href="/Character/Dragon ball"><img src="/img/dragon-ball-z-dbz-crystal-ball-1-star-png-701751694862293fasot8y7xc-removebg-preview.png" alt="Example" ></a>
       </button>
  </div>
  <!-- Copy Notification -->
  <div id="copy-notification">Quote copied to clipboard!</div>

  <!-- JavaScript -->
<script>
    // Function to copy the quote text
function copyQuote(element) {
  const quoteText = element.querySelector('p').innerText;
  navigator.clipboard.writeText(quoteText).then(() => {
    showNotification();
  });
}

// Show a notification when the quote is copied
function showNotification() {
  const notification = document.getElementById('copy-notification');
  notification.style.display = 'block';
  setTimeout(() => {
    notification.style.display = 'none';
  }, 3000); // Notification disappears after 3 seconds
}

  </script>
</body>
</html>
